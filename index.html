      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedFile(file);
          setTitleInput(file.name.replace(/\.[^/.]+$/, ""));
        }
      };

      const startAnalysis = () => {
        if (!selectedFile && !titleInput) return;

        setIsAnalyzing(true);
        setProgress(15);
        setStepText('Extracting audio stream from presentation recording...');

        setTimeout(() => {
          setProgress(45);
          setStepText('Running Whisper AI neural speech transcription...');
        }, 1200);

        setTimeout(() => {
          setProgress(75);
          setStepText('Calculating WPM cadence & detecting filler word frequency...');
        }, 2400);

        setTimeout(() => {
          setProgress(100);
          setStepText('Generating evaluation report & score matrix...');
        }, 3600);

        setTimeout(() => {
          const newReport = {
            id: 'eval-' + Date.now(),
            title: titleInput || 'New Presentation Evaluation',
            date: 'Just now',
            pace: '136 WPM',
            score: 91,
            duration: '06:30',
            fillerCount: 4,
            fillerRate: '0.7%',
            clarityScore: '94%',
            confidenceScore: '92%',
            tier: 'Top 5% speaker tier',
            status: 'Optimal Pace',
            transcript: [
              { time: '00:04', text: 'Welcome team. Today I want to walk through our project roadmap.', filler: false },
              { time: '00:18', text: 'Um, we have achieved major milestones in our latest deployment.', filler: true, word: 'um' },
              { time: '00:40', text: 'Our customer feedback scores show a significant positive trend.', filler: false }
            ],
            strengths: [
              'Clear and articulate pronunciation of key technical terms.',
              'Great vocal pacing staying consistently within 130–140 WPM range.'
            ],
            improvements: [
              'Minor filler word detected during transition to slide 2.'
            ]
          };
          onComplete(newReport);
        }, 4200);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div className="card-light rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
            
            {/* Header */}
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg">
                  <i className="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div>
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                    Upload Speech Recording
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Supports .mp4, .mov, .wav, .mp3 files up to 500MB
                  </p>
                </div>
              </div>
              <button 
                onClick={onClose}
                className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
              >
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            {!isAnalyzing ? (
              <div className="space-y-4">
                
                {/* File Dropzone */}
                <div className="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl p-8 text-center bg-slate-50/50 dark:bg-slate-800/30 hover:border-emerald-500 transition-colors relative cursor-pointer">
                  <input
                    type="file"
                    accept="audio/*,video/*"
                    onChange={handleFileSelect}
                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                  />
                  <div className="space-y-2">
                    <div className="w-12 h-12 mx-auto rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl">
                      <i className="fa-solid fa-file-audio"></i>
                    </div>
                    <p className="text-xs font-bold text-slate-700 dark:text-slate-200">
                      {selectedFile ? selectedFile.name : 'Drag & drop video or audio file here'}
                    </p>
                    <p className="text-[11px] text-slate-400">
                      {selectedFile ? `${(selectedFile.size / (1024*1024)).toFixed(1)} MB` : 'or click to browse from device'}
                    </p>
                  </div>
                </div>

                {/* Title Input */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                    Presentation Title
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Q4 Executive Keynote Pitch"
                    value={titleInput}
                    onChange={(e) => setTitleInput(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-200"
                  />
                </div>

                {/* Actions */}
                <div className="pt-2 flex justify-end space-x-3">
                  <button
                    onClick={onClose}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={startAnalysis}
                    disabled={!selectedFile && !titleInput}
                    className="btn-green-gradient px-6 py-2.5 rounded-xl text-xs font-bold disabled:opacity-50"
                  >
                    Start AI Evaluation
                  </button>
                </div>

              </div>
            ) : (
              /* Simulated AI Analysis Screen */
              <div className="py-8 text-center space-y-6">
                
                {/* Animated Waveform */}
                <div className="flex items-center justify-center space-x-1.5 h-16">
                  {[40, 75, 100, 60, 90, 45, 80, 50, 95, 30].map((h, i) => (
                    <div
                      key={i}
                      className="w-1.5 bg-emerald-500 rounded-full animate-bar"
                      style={{ height: `${h}%`, animationDelay: `${i * 0.1}s` }}
                    ></div>
                  ))}
                </div>

                <div className="space-y-2">
                  <h4 className="text-sm font-bold text-slate-900 dark:text-white">
                    Evaluating Speech & Delivery...
                  </h4>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-mono">
                    {stepText}
                  </p>
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                  <div 
                    className="bg-gradient-to-r from-teal-500 to-emerald-500 h-full transition-all duration-500 rounded-full"
                    style={{ width: `${progress}%` }}
                  ></div>
                </div>

                <p className="text-[11px] font-bold text-emerald-600 dark:text-emerald-400">
                  {progress}% Complete
                </p>

              </div>
            )}

          </div>
        </div>
      );
    }

    // --- REPORT MODAL COMPONENT (Detailed View) ---
    function ReportModal({ evalData, onClose }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-md animate-fadeIn">
          <div className="card-light rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 space-y-6 shadow-2xl relative">
            
            {/* Header */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-5 gap-4">
              <div>
                <div className="flex items-center space-x-3">
                  <span className="px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
                    Score: {evalData.score}% ({evalData.tier})
                  </span>
                  <span className="text-xs text-slate-400 font-semibold">{evalData.date}</span>
                </div>
                <h2 className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                  {evalData.title}
                </h2>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => alert("Downloading PDF Evaluation Report...")}
                  className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-bold flex items-center space-x-2"
                >
                  <i className="fa-solid fa-file-pdf text-rose-500"></i>
                  <span>Export PDF</span>
                </button>
                <button 
                  onClick={onClose}
                  className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-slate-900 dark:hover:text-white"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>

            {/* AUDIO PLAYER & WAVEFORM SIMULATOR */}
            <div className="bg-slate-900 text-white rounded-2xl p-5 space-y-4 shadow-xl">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <button
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="w-10 h-10 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center text-sm transition-transform active:scale-95"
                  >
                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}`}></i>
                  </button>
                  <div>
                    <p className="text-xs font-bold text-slate-200">Presentation Audio Stream</p>
                    <p className="text-[10px] text-slate-400 font-mono">01:15 / {evalData.duration}</p>
                  </div>
                </div>

                <div className="text-xs font-mono font-bold text-emerald-400">
                  {isPlaying ? '▶ Playing Audio' : '⏸ Paused'}
                </div>
              </div>

              {/* Waveform Visualization */}
              <div className="flex items-center space-x-1 h-12 px-2 bg-slate-950/80 rounded-xl">
                {Array.from({ length: 45 }).map((_, idx) => {
                  const isFillerMark = idx === 12 || idx === 28;
                  const height = isFillerMark ? 90 : ((idx * 7) % 65) + 20;
                  return (
                    <div
                      key={idx}
                      className={`flex-1 rounded-full transition-all ${
                        isFillerMark 
                          ? 'bg-rose-500' 
                          : idx < 18 
                          ? 'bg-emerald-400' 
                          : 'bg-slate-700'
                      }`}
                      style={{ height: `${height}%` }}
                      title={isFillerMark ? 'Filler Word Detected' : 'Audio Waveform'}
                    ></div>
                  );
                })}
              </div>
            </div>

            {/* DETAIL METRIC CARDS */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/60">
                <span className="text-[11px] font-bold text-slate-400">Pace / Cadence</span>
                <p className="text-lg font-black text-slate-900 dark:text-white mt-1">{evalData.pace}</p>
                <span className="text-[10px] text-emerald-600 font-semibold">Optimal Range</span>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/60">
                <span className="text-[11px] font-bold text-slate-400">Filler Word Rate</span>
                <p className="text-lg font-black text-emerald-600 dark:text-emerald-400 mt-1">{evalData.fillerRate}</p>
                <span className="text-[10px] text-slate-500 font-medium">{evalData.fillerCount} filler words</span>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/60">
                <span className="text-[11px] font-bold text-slate-400">Clarity & Articulation</span>
                <p className="text-lg font-black text-slate-900 dark:text-white mt-1">{evalData.clarityScore}</p>
                <span className="text-[10px] text-emerald-600 font-semibold">Very Clear</span>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/60">
                <span className="text-[11px] font-bold text-slate-400">Confidence Score</span>
                <p className="text-lg font-black text-slate-900 dark:text-white mt-1">{evalData.confidenceScore}</p>
                <span className="text-[10px] text-emerald-600 font-semibold">Strong Modulation</span>
              </div>
            </div>

            {/* TRANSCRIPT & AI FEEDBACK TABS */}
            <div className="space-y-4">
              <div className="flex border-b border-slate-200 dark:border-slate-800 space-x-6 text-xs font-bold">
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`pb-3 transition-colors ${activeTab === 'overview' ? 'border-b-2 border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'text-slate-400 hover:text-slate-600'}`}
                >
                  AI Feedback & Key Insights
                </button>
                <button
                  onClick={() => setActiveTab('transcript')}
                  className={`pb-3 transition-colors ${activeTab === 'transcript' ? 'border-b-2 border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'text-slate-400 hover:text-slate-600'}`}
                >
                  Annotated Speech Transcript
                </button>
              </div>

              {activeTab === 'overview' ? (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                  
                  {/* Strengths */}
                  <div className="space-y-3 p-4 rounded-2xl bg-emerald-50/60 dark:bg-emerald-950/30 border border-emerald-200/50 dark:border-emerald-800/50">
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-emerald-800 dark:text-emerald-300 flex items-center space-x-2">
                      <i className="fa-solid fa-circle-check text-emerald-500"></i>
                      <span>Key Delivery Strengths</span>
                    </h4>
                    <ul className="space-y-2">
                      {evalData.strengths.map((st, i) => (
                        <li key={i} className="text-xs text-slate-700 dark:text-slate-300 flex items-start space-x-2">
                          <span className="text-emerald-500 font-bold">•</span>
                          <span>{st}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Areas for Improvement */}
                  <div className="space-y-3 p-4 rounded-2xl bg-amber-50/60 dark:bg-amber-950/30 border border-amber-200/50 dark:border-amber-800/50">
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-amber-800 dark:text-amber-300 flex items-center space-x-2">
                      <i className="fa-solid fa-triangle-exclamation text-amber-500"></i>
                      <span>Recommended Improvements</span>
                    </h4>
                    <ul className="space-y-2">
                      {evalData.improvements.map((imp, i) => (
                        <li key={i} className="text-xs text-slate-700 dark:text-slate-300 flex items-start space-x-2">
                          <span className="text-amber-500 font-bold">•</span>
                          <span>{imp}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                </div>
              ) : (
                /* Transcript List */
                <div className="space-y-3 pt-2 max-h-60 overflow-y-auto pr-2">
                  {evalData.transcript.map((line, idx) => (
                    <div key={idx} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 text-xs flex items-start space-x-3">
                      <span className="font-mono text-slate-400 font-semibold">{line.time}</span>
                      <p className="text-slate-800 dark:text-slate-200 flex-1 leading-relaxed">
                        {line.text}
                      </p>
                      {line.filler && (
                        <span className="px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 text-[10px] font-bold">
                          Filler: "{line.word}"
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              )}

            </div>

          </div>
        </div>
      );
    }

    // --- RENDER REACT APP ---
    ReactDOM.createRoot(document.getElementById('root')).render(<PresentationEvaluatorApp />);
  </script>
</body>
</html>
